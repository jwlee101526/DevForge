spring:
  application:
    name: devforge

  datasource:
    url: jdbc:sqlite:${DEVFORGE_DB_PATH:./data/devforge.db}
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

ai-provider:
  default-provider: ${AI_PROVIDER_DEFAULT:Antigravity}
  antigravity:
    executable-path: ${ANTIGRAVITY_EXECUTABLE_PATH:agy}
    output-format: json
    timeout-seconds: ${ANTIGRAVITY_TIMEOUT_SECONDS:300}
    log-file: ${ANTIGRAVITY_LOG_FILE:./build/antigravity-cli.log}
    auto-configure-permissions: ${ANTIGRAVITY_AUTO_CONFIGURE_PERMISSIONS:true}
    shared-config-path: ${ANTIGRAVITY_SHARED_CONFIG_PATH:}
    permission-allow:
      - command(agy --help)
    env:
      GEMINI_API_KEY: ${GEMINI_API_KEY:}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:}
      ANTIGRAVITY_API_KEY: ${ANTIGRAVITY_API_KEY:}
logging:
  level:
    com.rmrdo.devforge: DEBUG
    org.hibernate.SQL: DEBUG

security:
  oauth2:
    client:
      registration:
        github:
          client-id: ${GITHUB_CLIENT_ID:x_github_client_id}
          client-secret: ${GITHUB_CLIENT_SECRET:x_github_client_secret}
        google:
          client-id: ${GOOGLE_CLIENT_ID:x_google_client_id}
          client-secret: ${GOOGLE_CLIENT_SECRET:x_google_client_secret}
        kakao:
          client-id: ${KAKAO_CLIENT_ID:x_kakao_rest_api_key}
          client-secret: ${KAKAO_CLIENT_SECRET:x_kakao_client_secret}