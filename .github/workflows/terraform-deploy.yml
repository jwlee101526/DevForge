name: Terraform Deploy

on:
  pull_request:
    branches:
      - deploy
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches:
      - deploy
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: Build and plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Allow Gradle wrapper execution
        run: chmod +x backend/gradlew

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Test backend
        working-directory: backend
        run: ./gradlew test

      - name: Build deployment package
        working-directory: backend
        run: ./gradlew bootJar

      - name: Terraform fmt
        working-directory: infra/app
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra/app
        run: >
          terraform init
          -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}"
          -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER_NAME }}"
          -backend-config="key=devforge-prod.tfstate"

      - name: Force unlock stuck state
        continue-on-error: true
        working-directory: infra/app
        run: terraform force-unlock -force 12bbc7e5-cd5f-3a64-40ef-6f8527482346 || true

      - name: Terraform validate
        working-directory: infra/app
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/app
        run: terraform plan -out=tfplan

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    # environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Allow Gradle wrapper execution
        run: chmod +x backend/gradlew

      - name: Build deployment package
        working-directory: backend
        run: ./gradlew bootJar

      - name: Terraform init
        working-directory: infra/app
        run: >
          terraform init
          -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}"
          -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER_NAME }}"
          -backend-config="key=devforge-prod.tfstate"

      - name: Force unlock stuck state
        continue-on-error: true
        working-directory: infra/app
        run: terraform force-unlock -force 12bbc7e5-cd5f-3a64-40ef-6f8527482346 || true

      - name: Terraform apply
        working-directory: infra/app
        run: terraform apply -auto-approve

      - name: Deploy package via Azure CLI
        run: |
          WEBAPP_NAME=$(az webapp list --resource-group rg-devforge-prod --query "[0].name" -o tsv)
          if [ -n "$WEBAPP_NAME" ]; then
            echo "Deploying backend/build/libs/app.jar to $WEBAPP_NAME..."
            az webapp deploy --resource-group rg-devforge-prod --name "$WEBAPP_NAME" --src-path backend/build/libs/app.jar --type jar --clean true
          fi
